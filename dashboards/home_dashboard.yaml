                              option: Living
                              lights:
                                - light.kitchen
                                - light.living_room
                                - light.dining_room
                                - light.office
                                - light.lanai
                          - type: custom:button-card
                            template: room_tab
                            tap_action:
                              action: perform-action
                              perform_action: input_select.select_option
                              target:
                                entity_id: input_select.dashboard_room_tab
                              data:
                                option: Bedrooms & baths
