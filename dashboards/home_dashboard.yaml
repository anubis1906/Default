                    card:
                      - background: rgba(0,0,0,0.04)
                      - border-radius: 14px
                      - padding: 4px
                      - margin-bottom: 8px
                    grid:
                      - grid-template-areas: '"tabs"'
                    custom_fields:
                      tabs:
                        - width: 100%

                - type: conditional
                  conditions:
                    - condition: state
                      entity: input_select.dashboard_room_tab
                      state_not: Bedrooms & baths
                  card:
                    type: grid
                    columns: 2
                    square: false
                    cards:
                      - type: custom:button-card
                        template: room_tile
