                          temp: sensor.kitchen_temperature
                      - type: custom:button-card
                        template: room_tile
                        entity: light.living_room
                        name: Living Room
                        icon: mdi:television
                        variables:
                          temp: sensor.living_room_temperature
                          media: media_player.living_room_tv
                      - type: custom:button-card
                        template: room_tile
                        entity: light.dining_room
                        name: Dining Room
                        icon: mdi:table-chair
                        variables:
                          temp: sensor.dining_room_temperature
                      - type: custom:button-card
                        template: room_tile
                        entity: light.office
                        name: Office
                        icon: mdi:desk
                        variables:
                          temp: sensor.office_temperature
                      - type: custom:button-card
                        template: room_tile
                        entity: light.lanai
                        name: Lanai
                        icon: mdi:palm-tree
                        variables:
                          temp: sensor.lanai_temperature
                          media: media_player.lanai_north
                      - type: custom:button-card
                        template: room_tile
                        entity: cover.garage_door
                        name: Garage
                        icon: mdi:garage
                        tap_action:
                          action: more-info

                - type: conditional
                  conditions:
                    - condition: state
                      entity: input_select.dashboard_room_tab
                      state: Bedrooms & baths
                  card:
                    type: grid
                    columns: 2
                    square: false
                    cards:
                      - type: custom:button-card
                        template: room_tile
                        entity: light.primary_bedroom
                        name: Primary Bedroom
                        icon: mdi:bed-king-outline
                        variables:
                          temp: sensor.primary_bedroom_temperature
                      - type: custom:button-card
                        template: room_tile
                        entity: light.primary_bathroom
