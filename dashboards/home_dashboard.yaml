                      - type: custom:button-card
                        template: room_tile
                        entity: light.guest_bedroom
                        name: Guest Bedroom
                        icon: mdi:bed-outline
                        variables:
                          temp: sensor.guest_bedroom_temperature
                      - type: custom:button-card
                        template: room_tile
                        entity: light.bedroom_2
                        name: Bedroom 2
                        icon: mdi:bed-single-outline
                        variables:
                          temp: sensor.bedroom_2_temperature
                      - type: custom:button-card
                        template: room_tile
                        entity: light.hall_bathroom
                        name: Hall Bath
