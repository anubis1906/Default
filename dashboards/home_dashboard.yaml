                      - type: custom:button-card
                        template: room_tile
                        entity: light.laundry
                        name: Laundry
                        icon: mdi:washing-machine

      # =========================================================== CALENDAR ==
      - type: custom:button-card
        template: panel
        view_layout:
          grid-area: calendar
        triggers_update: all
        tap_action:
          action: navigate
          navigation_path: /calendar
        variables:
          title: Calendar
          subtitle_color: '#c77d12'
          # Each calendar entity exposes its next upcoming event.
          calendars:
            - calendar.family
            - calendar.b_will
            - calendar.karla
            - calendar.trash_recycling
          subtitle: |
            [[[
              const today = new Date().toDateString();
              const bin = variables.calendars.some(c => {
                const s = states[c];
                if (!s || !s.attributes.start_time) return false;
                const d = new Date(s.attributes.start_time.replace(' ', 'T'));
                return d.toDateString() === today && /trash|garbage|recycl|bin|yard waste/i.test(s.attributes.message || '');
              });
              return bin ? '<span style="float:right;font-weight:600">Trash day today</span>' : '';
            ]]]
        custom_fields:
          body: |
            [[[
              const events = variables.calendars
                .map(c => states[c])
                .filter(s => s && s.attributes.message && s.attributes.start_time)
                .map(s => ({
                  title: s.attributes.message,
                  start: new Date(s.attributes.start_time.replace(' ', 'T')),
                  allDay: s.attributes.all_day,
                  who: (s.attributes.friendly_name || '').replace(/ calendar$/i, ''),
                }))
                .sort((a, b) => a.start - b.start)
                .slice(0, 4);
              if (!events.length) return '<div class="empty">Nothing coming up</div>';
              return events.map(e => {
                const wd = e.start.toLocaleDateString(undefined, { weekday: 'short' });
                const tm = e.allDay ? 'All day' : e.start.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
                const mon = e.start.toLocaleDateString(undefined, { month: 'short' }).toUpperCase();
                return `<div class="ev">
                  <div class="date"><b>${e.start.getDate()}</b><span>${mon}</span></div>
                  <div class="txt"><b>${e.title}</b><span>${wd} · ${tm}${e.who ? ' · ' + e.who : ''}</span></div>
                </div>`;
              }).join('');
            ]]]
        extra_styles: |
          .ev { display:flex; align-items:center; gap:12px; padding:8px; margin-bottom:8px; border-radius:16px;
                background:rgba(0,0,0,0.03); text-align:left; }
          .date { width:40px; height:44px; border-radius:12px; background:#fff; border:1px solid rgba(0,0,0,0.06);
                  display:flex; flex-direction:column; align-items:center; justify-content:center; flex:none; }
          .date b { font-size:17px; line-height:1; color:#1c1c1c; }
          .date span { font-size:9px; letter-spacing:.06em; color:#888; margin-top:2px; }
          .txt { display:flex; flex-direction:column; min-width:0; }
          .txt b { font-size:14px; font-weight:600; color:#1c1c1c; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          .txt span { font-size:12px; color:#888; }
          .empty { color:#888; font-size:13px; padding:8px; }

      # ================================================================ CAR ==
      - type: custom:button-card
        template: panel
        view_layout:
          grid-area: car
        entity: sensor.car_battery_level
        triggers_update: all
        tap_action:
          action: more-info
        variables:
          title: Car
          range: sensor.car_range
          lock: lock.car_doors
          charging: binary_sensor.car_charging
          charge_limit: number.car_charge_limit
          tracker: device_tracker.car
          subtitle: |
            [[[
              const c = states[variables.charging];
              if (c && ['on', 'charging'].includes(c.state)) return '<span style="float:right;color:#3a8ee6">Charging</span>';
              const t = states[variables.tracker];
              if (!t) return '';
              const where = t.state === 'home' ? 'Parked at home' : t.state === 'not_home' ? 'Away' : t.state;
              return `<span style="float:right">${where}</span>`;
            ]]]
        custom_fields:
          body: |
            [[[
              const soc = entity ? parseFloat(entity.state) : NaN;
              const r = states[variables.range];
              const range = r && !isNaN(parseFloat(r.state)) ? `${Math.round(parseFloat(r.state))} ${r.attributes.unit_of_measurement || 'mi'} range` : '';
              const l = states[variables.lock];
              const locked = l && l.state === 'locked';
              const lim = states[variables.charge_limit];
              const pct = isNaN(soc) ? 0 : Math.max(0, Math.min(100, soc));
              const bar = pct < 20 ? '#e53935' : pct < 40 ? '#f39c12' : '#2eaa5c';
              return `
                <div class="top">
                  <div><div class="big">${isNaN(soc) ? '—' : Math.round(soc)}<sup>%</sup></div><div class="rng">${range}</div></div>
                  <ha-icon class="car" icon="mdi:car-estate"></ha-icon>
                </div>
                <div class="bar"><div style="width:${pct}%;background:linear-gradient(90deg, ${bar}, ${bar}cc)"></div></div>
                <div class="pills">
                  ${l ? `<span class="pill" style="${locked ? 'background:#e9f6ee;color:#2a8a4c;border-color:#cfe9d8' : 'background:#fdecea;color:#c0392b;border-color:#f3c6c0'}">
                    <ha-icon icon="${locked ? 'mdi:lock-outline' : 'mdi:lock-open-variant-outline'}"></ha-icon>${locked ? 'Locked' : 'Unlocked'}</span>` : ''}
                  ${lim ? `<span class="pill"><ha-icon icon="mdi:ev-station"></ha-icon>Limit ${Math.round(parseFloat(lim.state))}%</span>` : ''}
                </div>`;
            ]]]
        extra_styles: |
          .top { display:flex; justify-content:space-between; align-items:center; text-align:left; }
          .big { font-size:46px; font-weight:800; letter-spacing:-0.03em; line-height:1; color:#1c1c1c; }
          .big sup { font-size:18px; font-weight:600; vertical-align:top; margin-left:2px; }
          .rng { font-size:13px; color:#555; margin-top:4px; }
          .car { --mdc-icon-size:72px; color:#6d6f66; }
          .bar { height:10px; border-radius:6px; background:rgba(0,0,0,0.06); margin:14px 0; overflow:hidden; }
          .bar div { height:100%; border-radius:6px; }
          .pills { display:flex; gap:8px; flex-wrap:wrap; }

      # ============================================================== MUSIC ==
      - type: custom:button-card
        template: panel
        view_layout:
          grid-area: music
        entity: media_player.lanai_north
        variables:
          title: Music
        tap_action:
          action: more-info
        custom_fields:
          body: |
            [[[
              const a = entity ? entity.attributes : {};
              const playing = entity && entity.state === 'playing';
              const idle = !entity || ['off', 'idle', 'standby', 'unavailable'].includes(entity.state) || !a.media_title;
              const art = a.entity_picture;
              return `<div class="music">
                <div class="disc ${playing ? 'spin' : ''}">
                  ${art ? `<img src="${art}">` : ''}<span class="hole"></span>
                </div>
                <div class="meta">
                  <b>${idle ? 'Nothing playing' : a.media_title}</b>
                  <span>${idle ? 'Pick music in the library' : (a.media_artist || a.app_name || '')}</span>
                  <span class="pill"><ha-icon icon="mdi:music-note-outline"></ha-icon>${a.friendly_name || 'Speaker'}</span>
                </div>
              </div>`;
            ]]]
          controls:
            card:
              type: horizontal-stack
              cards:
                - type: custom:button-card
                  template: media_btn
                  icon: mdi:skip-previous
                  tap_action:
                    action: perform-action
                    perform_action: media_player.media_previous_track
                    target:
                      entity_id: media_player.lanai_north
                - type: custom:button-card
                  template: media_btn
                  entity: media_player.lanai_north
                  icon: '[[[ return entity && entity.state === "playing" ? "mdi:pause" : "mdi:play"; ]]]'
                  tap_action:
                    action: perform-action
                    perform_action: media_player.media_play_pause
                    target:
                      entity_id: media_player.lanai_north
                  styles:
                    card:
                      - width: 56px
                      - height: 56px
                      - background: linear-gradient(160deg, #b9a4f4, #8f6ee8)
                      - border: none
                      - box-shadow: 0 6px 16px rgba(143,110,232,0.4)
                    icon:
                      - color: '#fff'
                      - width: 24px
                - type: custom:button-card
                  template: media_btn
                  icon: mdi:skip-next
                  tap_action:
                    action: perform-action
                    perform_action: media_player.media_next_track
                    target:
                      entity_id: media_player.lanai_north
        styles:
          grid:
            - grid-template-areas: '"head" "body" "controls"'
            - grid-template-rows: min-content 1fr min-content
          custom_fields:
            controls:
              - justify-self: end
              - width: 172px
              - margin-top: -52px
        extra_styles: |
          .music { display:flex; align-items:center; gap:18px; text-align:left; }
          .disc { position:relative; width:120px; height:120px; border-radius:50%; flex:none; overflow:hidden;
                  background:radial-gradient(circle, #2b2a3a 0 30%, #14141c 31% 33%, #232231 34% 60%, #111118 61% 100%);
                  box-shadow:0 10px 24px rgba(0,0,0,0.25); display:flex; align-items:center; justify-content:center; }
          .disc img { position:absolute; width:56%; height:56%; border-radius:50%; object-fit:cover; }
          .disc .hole { position:relative; width:10px; height:10px; border-radius:50%; background:#f2eefc; }
          .disc.spin { animation: spin 6s linear infinite; }
          @keyframes spin { to { transform: rotate(360deg); } }
          .meta { display:flex; flex-direction:column; gap:4px; min-width:0; align-self:flex-start; padding-top:8px; }
          .meta b { font-size:17px; color:#1c1c1c; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          .meta > span:not(.pill) { font-size:13px; color:#888; }
          .meta .pill { align-self:flex-start; margin-top:6px; }
