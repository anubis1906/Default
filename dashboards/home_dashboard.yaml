                - type: custom:button-card
                  template: qa_tile
                  entity: script.good_morning
                  name: Morning
                  icon: mdi:weather-night
                  label: '[[[ return entity && entity.state === "on" ? "Running…" : "Tap to run"; ]]]'
                  variables:
                    active: '[[[ return entity && entity.state === "on"; ]]]'
                    accent: '#7e57c2'
                    tint: rgba(126,87,194,0.14)
                  tap_action:
                    action: perform-action
                    perform_action: script.turn_on
                    target:
                      entity_id: script.good_morning

                - type: custom:button-card
                  template: qa_tile
                  name: Climate
                  icon: mdi:air-conditioner
                  triggers_update: all
                  variables:
                    climates:
                      - climate.downstairs
                      - climate.upstairs
                    active: |
                      [[[ return variables.climates.some(e => states[e] && !['off', 'unavailable'].includes(states[e].state)); ]]]
                    accent: '#1e88e5'
                    tint: rgba(30,136,229,0.14)
                  label: |
                    [[[
                      const on = variables.climates.filter(e => states[e] && !['off', 'unavailable'].includes(states[e].state)).length;
                      return `${on} of ${variables.climates.length} on`;
                    ]]]
                  tap_action:
                    action: more-info
                    entity: climate.downstairs

                - type: custom:button-card
                  template: qa_tile
                  name: Lights
                  icon: mdi:lightbulb-on-outline
                  triggers_update: all
                  variables:
                    active: |
                      [[[ return Object.keys(states).some(e => e.startsWith('light.') && states[e].state === 'on' && !states[e].attributes.entity_id); ]]]
                    accent: '#e8a33d'
                    tint: rgba(245,178,60,0.18)
                  label: |
                    [[[
                      const n = Object.keys(states).filter(e => e.startsWith('light.') && states[e].state === 'on' && !states[e].attributes.entity_id).length;
                      return n ? `${n} on` : 'All off';
                    ]]]
                  tap_action:
                    action: perform-action
                    perform_action: light.turn_off
                    target:
                      entity_id: all
                    confirmation:
                      text: Turn off every light in the house?

                - type: custom:button-card
                  template: qa_tile
                  entity: switch.water_heater
                  name: Water heater
                  icon: mdi:water-boiler
                  label: '[[[ return entity && entity.state === "on" ? "Heating" : "Off"; ]]]'
                  variables:
                    active: '[[[ return entity && entity.state === "on"; ]]]'
                    accent: '#e5533d'
                    tint: rgba(229,83,61,0.12)
                  tap_action:
                    action: toggle

                - type: custom:button-card
                  template: qa_tile
                  entity: vacuum.robot_vacuum
                  name: Vacuum
                  icon: mdi:robot-vacuum
                  label: |
                    [[[ return entity ? entity.state.charAt(0).toUpperCase() + entity.state.slice(1) : '—'; ]]]
                  variables:
                    active: '[[[ return entity && ["cleaning", "returning"].includes(entity.state); ]]]'
                    accent: '#26a69a'
                    tint: rgba(38,166,154,0.14)
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.start
                    target:
                      entity_id: vacuum.robot_vacuum
                  hold_action:
                    action: perform-action
                    perform_action: vacuum.return_to_base
                    target:
                      entity_id: vacuum.robot_vacuum
                  double_tap_action:
                    action: more-info

                - type: custom:button-card
                  template: qa_tile
                  entity: switch.pool_pump
                  name: Pool
                  icon: mdi:pool
                  label: '[[[ return entity && entity.state === "on" ? "Pump running" : "Off"; ]]]'
                  variables:
                    active: '[[[ return entity && entity.state === "on"; ]]]'
                    accent: '#039be5'
                    tint: rgba(3,155,229,0.14)
                  tap_action:
                    action: toggle

                - type: custom:button-card
                  template: qa_tile
                  entity: switch.sprinklers
                  name: Sprinklers
                  icon: mdi:sprinkler-variant
                  label: '[[[ return entity && entity.state === "on" ? "Watering" : "Idle"; ]]]'
                  variables:
                    active: '[[[ return entity && entity.state === "on"; ]]]'
                    accent: '#43a047'
                    tint: rgba(67,160,71,0.14)
                  tap_action:
                    action: toggle
                    confirmation:
                      text: Toggle the sprinklers?

                - type: custom:button-card
                  template: qa_tile
                  entity: cover.garage_door
                  name: Garage
                  icon: mdi:garage
                  label: |
                    [[[ return entity ? entity.state.charAt(0).toUpperCase() + entity.state.slice(1) : '—'; ]]]
                  variables:
                    active: '[[[ return entity && entity.state !== "closed"; ]]]'
                    accent: '#e53935'
                    tint: rgba(229,57,53,0.12)
                  tap_action:
                    action: toggle
                    confirmation:
                      text: Open/close the garage door?

      # ============================================================== ROOMS ==
      - type: custom:button-card
        template: panel
        view_layout:
          grid-area: rooms
        triggers_update: all
        variables:
          title: Rooms
          chevron: false
          subtitle_color: '#555'
          room_lights:
            - light.kitchen
            - light.living_room
            - light.dining_room
            - light.office
            - light.lanai
            - light.primary_bedroom
            - light.primary_bathroom
            - light.guest_bedroom
            - light.bedroom_2
            - light.hall_bathroom
            - light.laundry
          subtitle: |
            [[[
              const n = variables.room_lights.filter(e => states[e] && states[e].state === 'on').length;
              return `<span style="float:right">${n} room${n === 1 ? '' : 's'} lit</span>`;
            ]]]
        custom_fields:
          body:
            card:
              type: vertical-stack
              cards:
                - type: custom:button-card
                  template: bare
                  custom_fields:
                    tabs:
                      card:
                        type: grid
                        columns: 2
                        square: false
                        cards:
                          - type: custom:button-card
                            template: room_tab
                            tap_action:
                              action: perform-action
                              perform_action: input_select.select_option
